[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crowbar-sdk"
version = "1.2.0"
description = "Make a PS4RT runtime Crowbar compatible: trophies, catalog, launch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/DiamondDogz/crowbar-sdk"

[project.scripts]
crowbar-check = "crowbar_sdk.check:main"
crowbar-fake = "crowbar_sdk.fake:main"

[tool.setuptools]
packages = ["crowbar_sdk"]
